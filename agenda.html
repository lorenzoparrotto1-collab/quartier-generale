<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04080f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#04080f; --panel:#0e1a28; --panel2:#0a1420; --line:#163048; --fg:#cfe3f0; --muted:#6f90a8;
    --blue:#43b4ff; --cyan:#38e6ff; --gold:#ffc46a; --live:#ff5d73; --ok:#35e09a;
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"Inter",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:var(--sans);color:var(--fg);min-height:100dvh;
    background:radial-gradient(900px 500px at 50% -10%,rgba(67,180,255,.06),transparent 55%),var(--bg);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:calc(14px + env(safe-area-inset-top,0px)) 40px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .back{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--fg);text-decoration:none;padding:8px 11px;border-radius:9px;background:var(--panel)}
  h1{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem;margin:0}
  .sect{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:14px;padding:14px;margin-bottom:16px}
  .sect h2{margin:0 0 10px;font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
  .sect h2 .dot{width:9px;height:9px;border-radius:50%}
  .dot.p{background:var(--gold)}.dot.t{background:var(--cyan)}.dot.n{background:var(--blue)}
  .add{display:flex;gap:8px;margin-bottom:12px}
  .add input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    font-family:var(--sans);font-size:.92rem;padding:10px 11px;border-radius:9px}
  .add input:focus{outline:none;border-color:var(--cyan)}
  .add button{border:1px solid rgba(56,230,255,.4);background:var(--panel);color:var(--cyan);
    font-family:var(--mono);font-size:.8rem;padding:0 14px;border-radius:9px;cursor:pointer}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  li{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  li .tx{flex:1;min-width:0;font-size:.9rem;word-break:break-word}
  li.done .tx{text-decoration:line-through;color:var(--muted)}
  .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;color:var(--ok);font-size:.8rem}
  li.done .chk{border-color:var(--ok);background:rgba(53,224,154,.12)}
  .del{background:none;border:0;color:var(--live);cursor:pointer;font-family:var(--mono);font-size:.62rem;padding:2px 4px}
  .empty{color:var(--muted);font-size:.84rem;padding:6px 2px}
  .tag{font-family:var(--mono);font-size:.56rem;color:var(--gold);letter-spacing:.06em;border:1px solid rgba(255,196,106,.3);border-radius:999px;padding:1px 7px;flex:none}
  .hint{color:var(--muted);font-size:.78rem;line-height:1.5;margin:0 0 18px}
  .hint b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html?menu">&lsaquo; QG</a>
    <h1>Agenda</h1>
  </div>
  <p class="hint">I tuoi progetti, le cose da fare e le note. Puoi aggiungerli qui, oppure dirli a J.A.R.V.I.S: <b>"ricordami di..."</b>, <b>"aggiungi progetto..."</b>, <b>"prendi nota..."</b>, <b>"cosa devo fare"</b>.</p>

  <div class="sect">
    <h2><span class="dot p"></span>Progetti</h2>
    <form class="add" id="pForm"><input id="pIn" placeholder="nuovo progetto..." maxlength="80"><button>+</button></form>
    <ul id="pList"></ul>
  </div>

  <div class="sect">
    <h2><span class="dot t"></span>Da fare</h2>
    <form class="add" id="tForm"><input id="tIn" placeholder="cosa devi fare..." maxlength="140"><button>+</button></form>
    <ul id="tList"></ul>
  </div>

  <div class="sect">
    <h2><span class="dot n"></span>Note</h2>
    <form class="add" id="nForm"><input id="nIn" placeholder="una nota..." maxlength="200"><button>+</button></form>
    <ul id="nList"></ul>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY="qg_agenda_v1";
  function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return{projects:o.projects||[],tasks:o.tasks||[],notes:o.notes||[]};}}catch(e){}return{projects:[],tasks:[],notes:[]};}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function uid(){return "x"+Date.now().toString(36)+Math.floor(Math.random()*1000);}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  var A=load();

  function render(){
    // progetti
    var pl=document.getElementById("pList");pl.innerHTML="";
    if(!A.projects.length)pl.innerHTML='<div class="empty">Nessun progetto.</div>';
    A.projects.forEach(function(p){
      var li=document.createElement("li");
      li.innerHTML='<span class="tx">'+esc(p.name)+'</span><button class="del" data-pd="'+p.id+'">rimuovi</button>';
      pl.appendChild(li);
    });
    // compiti
    var tl=document.getElementById("tList");tl.innerHTML="";
    if(!A.tasks.length)tl.innerHTML='<div class="empty">Niente da fare. Ottimo.</div>';
    A.tasks.forEach(function(t){
      var li=document.createElement("li");if(t.done)li.className="done";
      li.innerHTML='<span class="chk" data-tc="'+t.id+'">'+(t.done?"✓":"")+'</span><span class="tx">'+esc(t.text)+'</span>'+(t.proj?'<span class="tag">'+esc(t.proj)+'</span>':'')+'<button class="del" data-td="'+t.id+'">x</button>';
      tl.appendChild(li);
    });
    // note
    var nl=document.getElementById("nList");nl.innerHTML="";
    if(!A.notes.length)nl.innerHTML='<div class="empty">Nessuna nota.</div>';
    A.notes.forEach(function(n){
      var li=document.createElement("li");
      li.innerHTML='<span class="tx">'+esc(n.text)+'</span><button class="del" data-nd="'+n.id+'">x</button>';
      nl.appendChild(li);
    });
  }

  document.getElementById("pForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("pIn").value.trim();if(!v)return;A.projects.push({id:uid(),name:v});document.getElementById("pIn").value="";save(A);render();});
  document.getElementById("tForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("tIn").value.trim();if(!v)return;A.tasks.unshift({id:uid(),text:v,done:false,proj:""});document.getElementById("tIn").value="";save(A);render();});
  document.getElementById("nForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("nIn").value.trim();if(!v)return;A.notes.unshift({id:uid(),text:v,ts:Date.now()});document.getElementById("nIn").value="";save(A);render();});

  document.body.addEventListener("click",function(e){
    var el=e.target;
    if(el.dataset.tc){var t=A.tasks.filter(function(x){return x.id===el.dataset.tc;})[0];if(t){t.done=!t.done;save(A);render();}return;}
    if(el.dataset.td){A.tasks=A.tasks.filter(function(x){return x.id!==el.dataset.td;});save(A);render();return;}
    if(el.dataset.pd){A.projects=A.projects.filter(function(x){return x.id!==el.dataset.pd;});save(A);render();return;}
    if(el.dataset.nd){A.notes=A.notes.filter(function(x){return x.id!==el.dataset.nd;});save(A);render();return;}
  });

  render();
})();
</script>
<script>
if("serviceWorker" in navigator){try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}catch(e){}}
</script>
</body>
</html>
