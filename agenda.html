<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04080f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Agenda">
<title>Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#05070c; --panel:rgba(255,255,255,.015); --panel2:rgba(255,255,255,.02); --line:rgba(255,205,135,.16);
    --fg:#e8eef6; --muted:#7e8ca0; --gold:#ffcf8a; --gold2:#ffe6bf; --goldline:rgba(255,200,120,.3);
    --live:#ff6a7d; --ok:#5fd6a6;
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"Inter",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:var(--sans);color:var(--fg);min-height:100dvh;
    background:radial-gradient(1100px 620px at 50% -12%,rgba(255,190,100,.06),transparent 60%),var(--bg);
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
    padding-block:calc(18px + env(safe-area-inset-top,0px)) 48px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .back{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--gold);text-decoration:none;padding:9px 13px;border-radius:10px;background:transparent}
  .back:hover{border-color:var(--goldline)}
  h1{font-family:var(--mono);letter-spacing:.26em;text-transform:uppercase;font-size:.9rem;margin:0;color:var(--gold2)}
  .sect{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:18px 18px 16px;margin-bottom:18px}
  .sect::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--goldline),transparent)}
  .sect h2{margin:0 0 14px;font-family:var(--mono);font-size:.64rem;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:9px;color:var(--gold)}
  .sect h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .add{display:flex;gap:8px;margin-bottom:14px}
  .add input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--fg);
    font-family:var(--sans);font-size:.92rem;padding:11px 12px;border-radius:4px}
  .add input::placeholder{color:var(--muted)}
  .add input:focus{outline:none;border-color:var(--goldline)}
  .add button{border:1px solid var(--goldline);background:transparent;color:var(--gold);
    font-family:var(--mono);font-size:1rem;padding:0 16px;border-radius:4px;cursor:pointer}
  .add button:hover{background:rgba(255,205,135,.06)}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{display:flex;align-items:center;gap:11px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:4px;padding:11px 12px}
  li .tx{flex:1;min-width:0;font-size:.9rem;word-break:break-word}
  li.done .tx{text-decoration:line-through;color:var(--muted)}
  .chk{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;color:var(--ok);font-size:.8rem}
  li.done .chk{border-color:var(--ok);background:rgba(95,214,166,.14)}
  .del{background:none;border:0;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 4px}
  .del:hover{color:var(--live)}
  .empty{color:var(--muted);font-size:.82rem;padding:4px 2px;font-style:italic}
  .tag{font-family:var(--mono);font-size:.54rem;color:var(--gold);letter-spacing:.08em;border:1px solid var(--goldline);border-radius:999px;padding:2px 8px;flex:none;text-transform:uppercase}
  .hint{color:var(--muted);font-size:.8rem;line-height:1.6;margin:0 0 22px}
  .hint b{color:var(--gold2);font-weight:600}
  .ver{text-align:center;color:var(--muted);font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;margin-top:26px;opacity:.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html?menu">&lsaquo; QG</a>
    <h1>Agenda</h1>
  </div>
  <p class="hint">I tuoi progetti, le cose da fare e le note. Puoi aggiungerli qui, oppure dirli a J.A.R.V.I.S: <b>"ricordami di..."</b>, <b>"aggiungi progetto..."</b>, <b>"prendi nota..."</b>, <b>"cosa devo fare"</b>.</p>

  <div class="sect">
    <h2><span class="dot p"></span>Progetti</h2>
    <form class="add" id="pForm"><input id="pIn" placeholder="nuovo progetto..." maxlength="80"><button>+</button></form>
    <ul id="pList"></ul>
  </div>

  <div class="sect">
    <h2><span class="dot t"></span>Da fare</h2>
    <form class="add" id="tForm"><input id="tIn" placeholder="cosa devi fare..." maxlength="140"><button>+</button></form>
    <ul id="tList"></ul>
  </div>

  <div class="sect">
    <h2><span class="dot n"></span>Note</h2>
    <form class="add" id="nForm"><input id="nIn" placeholder="una nota..." maxlength="200"><button>+</button></form>
    <ul id="nList"></ul>
  </div>
  <div class="ver">v<span id="ver"></span></div>
</div>

<script>
  var APP_VERSION="31";
  document.getElementById("ver").textContent=APP_VERSION;
  (function(){try{fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){var m=t.match(/APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION){location.replace(location.pathname+"?v="+Date.now());}}).catch(function(){});}catch(e){}})();
</script>
<script>
(function(){
  "use strict";
  var KEY="qg_agenda_v1";
  function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return{projects:o.projects||[],tasks:o.tasks||[],notes:o.notes||[]};}}catch(e){}return{projects:[],tasks:[],notes:[]};}
  function save(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function uid(){return "x"+Date.now().toString(36)+Math.floor(Math.random()*1000);}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  var A=load();

  function render(){
    // progetti
    var pl=document.getElementById("pList");pl.innerHTML="";
    if(!A.projects.length)pl.innerHTML='<div class="empty">Nessun progetto.</div>';
    A.projects.forEach(function(p){
      var li=document.createElement("li");
      li.innerHTML='<span class="tx">'+esc(p.name)+'</span><button class="del" data-pd="'+p.id+'">rimuovi</button>';
      pl.appendChild(li);
    });
    // compiti
    var tl=document.getElementById("tList");tl.innerHTML="";
    if(!A.tasks.length)tl.innerHTML='<div class="empty">Niente da fare. Ottimo.</div>';
    A.tasks.forEach(function(t){
      var li=document.createElement("li");if(t.done)li.className="done";
      li.innerHTML='<span class="chk" data-tc="'+t.id+'">'+(t.done?"✓":"")+'</span><span class="tx">'+esc(t.text)+'</span>'+(t.proj?'<span class="tag">'+esc(t.proj)+'</span>':'')+'<button class="del" data-td="'+t.id+'">x</button>';
      tl.appendChild(li);
    });
    // note
    var nl=document.getElementById("nList");nl.innerHTML="";
    if(!A.notes.length)nl.innerHTML='<div class="empty">Nessuna nota.</div>';
    A.notes.forEach(function(n){
      var li=document.createElement("li");
      li.innerHTML='<span class="tx">'+esc(n.text)+'</span><button class="del" data-nd="'+n.id+'">x</button>';
      nl.appendChild(li);
    });
  }

  document.getElementById("pForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("pIn").value.trim();if(!v)return;A.projects.push({id:uid(),name:v});document.getElementById("pIn").value="";save(A);render();});
  document.getElementById("tForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("tIn").value.trim();if(!v)return;A.tasks.unshift({id:uid(),text:v,done:false,proj:""});document.getElementById("tIn").value="";save(A);render();});
  document.getElementById("nForm").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("nIn").value.trim();if(!v)return;A.notes.unshift({id:uid(),text:v,ts:Date.now()});document.getElementById("nIn").value="";save(A);render();});

  document.body.addEventListener("click",function(e){
    var el=e.target;
    if(el.dataset.tc){var t=A.tasks.filter(function(x){return x.id===el.dataset.tc;})[0];if(t){t.done=!t.done;save(A);render();}return;}
    if(el.dataset.td){A.tasks=A.tasks.filter(function(x){return x.id!==el.dataset.td;});save(A);render();return;}
    if(el.dataset.pd){A.projects=A.projects.filter(function(x){return x.id!==el.dataset.pd;});save(A);render();return;}
    if(el.dataset.nd){A.notes=A.notes.filter(function(x){return x.id!==el.dataset.nd;});save(A);render();return;}
  });

  render();
})();
</script>
<script>
if("serviceWorker" in navigator){try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}catch(e){}}
</script>
</body>
</html>
