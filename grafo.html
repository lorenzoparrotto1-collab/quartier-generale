<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Grafo">
<title>Grafo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#05070c; --line:rgba(255,205,135,.16); --fg:#e8eef6; --muted:#7e8ca0;
    --gold:#ffcf8a; --gold2:#ffe6bf; --goldline:rgba(255,200,120,.3);
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"Inter",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);color:var(--fg);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;z-index:5;
    background:linear-gradient(180deg,rgba(5,7,12,.85),transparent)}
  .back{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--gold);text-decoration:none;padding:9px 13px;border-radius:10px;background:rgba(5,7,12,.6)}
  h1{font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;font-size:.82rem;margin:0;color:var(--gold2)}
  .hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;
    font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;color:var(--muted);z-index:5;pointer-events:none;opacity:.7}
  .empty{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:4}
  .empty p{color:var(--muted);font-size:.9rem;line-height:1.6;max-width:30ch}
  .empty b{color:var(--gold2)}
</style>
</head>
<body>
<div class="bar"><a class="back" href="index.html?menu">&lsaquo; QG</a><h1>Rete del cervello</h1></div>
<canvas id="c"></canvas>
<div class="hint" id="hint">trascina per muovere · pizzica per ingrandire</div>

<script>
  var APP_VERSION="1";
  (function(){try{fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){var m=t.match(/APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION){location.replace(location.pathname+"?v="+Date.now());}}).catch(function(){});}catch(e){}})();
</script>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("c"),ctx=cv.getContext("2d"),DPR=Math.min(window.devicePixelRatio||1,2);
  var COL=["#43b4ff","#5fd6a6","#c58cff","#ff8da3","#38e6ff","#ffd24a","#7ee07a","#ff9d5c","#9db4ff"];

  function load(){try{var r=localStorage.getItem("qg_agenda_v1");if(r){var o=JSON.parse(r);return{projects:o.projects||[],tasks:o.tasks||[],notes:o.notes||[]};}}catch(e){}return null;}

  // ---- costruzione nodi/archi dai dati ----
  var nodes=[], links=[], byId={};
  function addNode(n){n.x=(Math.random()-0.5)*300;n.y=(Math.random()-0.5)*300;n.vx=0;n.vy=0;nodes.push(n);byId[n.id]=n;return n;}
  function build(){
    var a=load(), seeded=false;
    if(!a||((a.projects.length+a.tasks.length+a.notes.length)===0)){
      a={projects:[{id:"p1",name:"Vendita siti con AI"},{id:"p2",name:"Canale TikTok"},{id:"p3",name:"Trading / ETF"}],
         tasks:[{id:"t1",text:"Preparare sito demo",proj:"Vendita siti con AI"},{id:"t2",text:"Listino 3 pacchetti",proj:"Vendita siti con AI"},
                {id:"t3",text:"Girare 3 video",proj:"Canale TikTok"},{id:"t4",text:"Studiare gli ETF",proj:"Trading / ETF"}],
         notes:[{id:"n1",text:"Idee nomi brand"},{id:"n2",text:"Hashtag da usare"}]};
      seeded=true;
    }
    var core=addNode({id:"__core",label:"J.A.R.V.I.S",type:"core",r:26,color:"#ffcf8a",fx:0,fy:0});
    a.projects.forEach(function(p,i){
      var c=COL[i%COL.length];
      var hub=addNode({id:"P:"+(p.id||p.name),label:p.name,type:"hub",r:15,color:c});
      links.push({a:core,b:hub,col:c});
    });
    a.tasks.forEach(function(t){
      var hub=t.proj?byId["P:"+t.proj]||findHubByName(t.proj):null;
      var par=hub||core, c=par.color||"#9db4ff";
      var nd=addNode({id:"T:"+(t.id||Math.random()),label:t.text,type:"task",r:7,color:c,done:!!t.done});
      links.push({a:par,b:nd,col:c});
    });
    a.notes.forEach(function(n){
      var nd=addNode({id:"N:"+(n.id||Math.random()),label:n.text,type:"note",r:6,color:"#ffd24a"});
      links.push({a:core,b:nd,col:"#ffd24a"});
    });
    return seeded;
  }
  function findHubByName(name){for(var i=0;i<nodes.length;i++){if(nodes[i].type==="hub"&&nodes[i].label===name)return nodes[i];}return null;}

  var seeded=build();

  // ---- vista (pan/zoom) ----
  var view={x:0,y:0,s:1};
  function resize(){cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);}
  resize();window.addEventListener("resize",resize);
  // fit iniziale dopo qualche passo di fisica
  var fitted=false;
  function fit(){
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    nodes.forEach(function(n){minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x);maxY=Math.max(maxY,n.y);});
    var w=maxX-minX+160,h=maxY-minY+160;
    var s=Math.min((innerWidth)/w,(innerHeight)/h,1.4);s=Math.max(s,0.3);
    view.s=s;view.x=innerWidth/2-((minX+maxX)/2)*s;view.y=innerHeight/2-((minY+maxY)/2)*s;
  }

  // ---- fisica semplice ----
  function step(){
    var i,j,n,m,dx,dy,d2,d,f;
    for(i=0;i<nodes.length;i++){n=nodes[i];
      for(j=i+1;j<nodes.length;j++){m=nodes[j];
        dx=n.x-m.x;dy=n.y-m.y;d2=dx*dx+dy*dy+0.01;
        if(d2<90000){d=Math.sqrt(d2);f=1800/d2;var ux=dx/d,uy=dy/d;n.vx+=ux*f;n.vy+=uy*f;m.vx-=ux*f;m.vy-=uy*f;}
      }
    }
    for(i=0;i<links.length;i++){var L=links[i];n=L.a;m=L.b;dx=m.x-n.x;dy=m.y-n.y;d=Math.sqrt(dx*dx+dy*dy)+0.01;
      var rest=(n.type==="core"||m.type==="core")?120:(n.type==="hub"||m.type==="hub")?70:55;
      f=(d-rest)*0.02;var ux=dx/d,uy=dy/d;n.vx+=ux*f;n.vy+=uy*f;m.vx-=ux*f;m.vy-=uy*f;
    }
    for(i=0;i<nodes.length;i++){n=nodes[i];
      n.vx+=(-n.x)*0.0015;n.vy+=(-n.y)*0.0015; // gravità al centro
      n.vx*=0.86;n.vy*=0.86;
      if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0;}
      else{n.x+=n.vx;n.y+=n.vy;}
    }
  }

  var tick=0;
  function draw(){
    for(var s=0;s<2;s++)step();
    tick++;
    if(!fitted&&tick>40){fit();fitted=true;}
    var w=cv.width,h=cv.height;
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,w,h);
    ctx.setTransform(DPR*view.s,0,0,DPR*view.s,DPR*view.x,DPR*view.y);
    // archi
    for(var i=0;i<links.length;i++){var L=links[i];
      ctx.strokeStyle=hexA(L.col,0.22);ctx.lineWidth=1/view.s;
      ctx.beginPath();ctx.moveTo(L.a.x,L.a.y);ctx.lineTo(L.b.x,L.b.y);ctx.stroke();
    }
    // nodi
    ctx.globalCompositeOperation="lighter";
    for(var k=0;k<nodes.length;k++){var n=nodes[k];
      var pls=n.type==="core"?(1+0.08*Math.sin(tick*0.05)):1;
      var r=n.r*pls;
      var gg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*2.4);
      gg.addColorStop(0,hexA(n.color,0.55));gg.addColorStop(1,hexA(n.color,0));
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(n.x,n.y,r*2.4,0,6.283);ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    for(var k2=0;k2<nodes.length;k2++){var q=nodes[k2];
      var r2=q.r*(q.type==="core"?(1+0.08*Math.sin(tick*0.05)):1);
      ctx.fillStyle=q.done?"#3a4452":q.color;
      ctx.beginPath();ctx.arc(q.x,q.y,r2,0,6.283);ctx.fill();
      ctx.lineWidth=1.5/view.s;ctx.strokeStyle="rgba(5,7,12,.7)";ctx.stroke();
      // etichette: core e hub sempre, il resto se abbastanza zoom
      if(q.type==="core"||q.type==="hub"||view.s>0.8){
        var fs=(q.type==="core"?15:q.type==="hub"?12:10)/view.s;
        ctx.font="600 "+fs+"px Inter,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
        var lab=q.label.length>26?q.label.slice(0,25)+"…":q.label;
        ctx.fillStyle="rgba(5,7,12,.85)";ctx.fillText(lab,q.x+0.6/view.s,q.y+r2+ (10/view.s)+0.6/view.s);
        ctx.fillStyle=q.type==="core"?"#ffe6bf":q.type==="hub"?"#e8eef6":"#aebccb";
        ctx.fillText(lab,q.x,q.y+r2+(10/view.s));
      }
    }
    requestAnimationFrame(draw);
  }
  function hexA(hex,a){var h=hex.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
  draw();

  // ---- interazione: pan + pinch ----
  var ptrs={}, lastDist=0, lastMid=null;
  cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};});
  cv.addEventListener("pointermove",function(e){
    if(!ptrs[e.pointerId])return;
    var ids=Object.keys(ptrs);
    if(ids.length===1){var p=ptrs[e.pointerId];view.x+=e.clientX-p.x;view.y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;}
    else if(ids.length>=2){
      ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
      var a=ptrs[ids[0]],b=ptrs[ids[1]];var dx=a.x-b.x,dy=a.y-b.y;var dist=Math.sqrt(dx*dx+dy*dy);var mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(lastDist){var f=dist/lastDist;var ns=Math.max(0.2,Math.min(3,view.s*f));
        view.x=mid.x-(mid.x-view.x)*(ns/view.s);view.y=mid.y-(mid.y-view.y)*(ns/view.s);view.s=ns;}
      lastDist=dist;lastMid=mid;
    }
  });
  function up(e){delete ptrs[e.pointerId];if(Object.keys(ptrs).length<2)lastDist=0;}
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",function(e){e.preventDefault();var f=e.deltaY<0?1.12:0.89;var ns=Math.max(0.2,Math.min(3,view.s*f));
    view.x=e.clientX-(e.clientX-view.x)*(ns/view.s);view.y=e.clientY-(e.clientY-view.y)*(ns/view.s);view.s=ns;},{passive:false});

  setTimeout(function(){var hh=document.getElementById("hint");if(hh)hh.style.display="none";},6000);
})();
</script>
<script>
if("serviceWorker" in navigator){try{navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}catch(e){}}
</script>
</body>
</html>
