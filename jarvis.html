<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04080f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#04080f; --blue:#43b4ff; --blue2:#8fd4ff; --cyan:#38e6ff; --dim:#2b5f86;
    --line:#123a57; --fg:#bfe6ff; --muted:#5f85a3; --warn:#ffd24a; --gold:#ffcf8a; --gold2:#ffe6bf; --goldline:rgba(255,200,120,.22);
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
    --disp:"Orbitron",var(--mono);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--mono);color:var(--fg);overflow:hidden;
    background:radial-gradient(1200px 800px at 50% 40%,#0a1826,#04080f 70%);
    -webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom,rgba(67,180,255,.04) 0 1px,transparent 1px 3px)}

  .bar{position:absolute;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
  .back{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);color:var(--fg);text-decoration:none;padding:7px 10px;border-radius:7px;background:rgba(10,24,38,.6)}
  .brandtag{margin-left:auto;font-family:var(--disp);letter-spacing:.3em;color:var(--dim);font-size:.72rem}

  .grid{position:absolute;inset:0;display:grid;z-index:5;
    grid-template-columns:minmax(190px,290px) minmax(0,1fr) minmax(190px,290px);
    grid-template-rows:1fr auto;gap:14px;align-items:center;
    padding:calc(54px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

  .panel{border:1px solid var(--goldline);background:linear-gradient(180deg,rgba(26,20,12,.5),rgba(10,10,14,.55));
    border-radius:14px;padding:13px 14px;backdrop-filter:blur(5px);align-self:stretch;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,220,160,.06)}
  .panel h3{margin:0 0 9px;font-family:var(--disp);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .colL,.colR{display:flex;flex-direction:column;gap:12px;align-self:stretch;min-height:0;justify-content:center}

  .big{font-family:var(--disp);font-size:1.55rem;color:var(--gold2);text-shadow:0 0 14px rgba(255,200,120,.45);line-height:1}
  .kv{font-size:.72rem;color:#9a8a74;margin-top:4px;letter-spacing:.06em}
  .meter{height:6px;border-radius:4px;background:rgba(255,200,120,.1);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,#c88a3a,var(--gold))}

  .console{font-size:.58rem;line-height:1.5;color:var(--dim);max-height:180px;overflow:hidden}
  .console .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .console .l.hot{color:var(--blue2)}

  /* reattore centrale */
  .core{position:relative;width:100%;aspect-ratio:1/1;max-width:min(620px,70vh);margin:0 auto;display:grid;place-items:center}
  .core canvas{position:absolute;inset:0;width:100%;height:100%}
  .coretext{position:relative;z-index:2;text-align:center;pointer-events:none}
  .coretext .t{font-family:var(--disp);letter-spacing:.34em;font-size:1rem;color:#dff3ff;text-shadow:0 0 16px rgba(56,230,255,.7)}
  .coretext .s{font-size:.62rem;color:var(--blue2);margin-top:6px;letter-spacing:.14em;min-height:14px}
  .statepill{position:relative;z-index:2;margin-top:10px;font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}

  nn{display:block}
  .nn{width:100%;height:110px;display:block}

  /* input in basso, su tutta la larghezza */
  .dock{grid-column:1 / -1;display:flex;gap:9px;align-items:center;
    border:1px solid var(--line);background:rgba(8,18,30,.8);border-radius:12px;padding:8px 10px}
  .dock .mic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(10,24,38,.8);color:var(--cyan);font-size:1rem;cursor:pointer;display:grid;place-items:center}
  .dock .mic.on{border-color:var(--cyan);box-shadow:0 0 14px rgba(56,230,255,.5);animation:micpulse 1.3s infinite}
  @keyframes micpulse{50%{box-shadow:0 0 22px rgba(56,230,255,.8)}}
  .dock input{flex:1;min-width:0;background:transparent;border:0;color:#dff3ff;font-family:var(--mono);font-size:.9rem;caret-color:var(--cyan)}
  .dock input:focus{outline:none}
  .dock .send{flex:none;border:1px solid var(--line);background:rgba(10,24,38,.8);color:var(--cyan);
    font-family:var(--mono);font-size:.8rem;padding:9px 13px;border-radius:9px;cursor:pointer}

  @media(max-width:720px){
    .grid{display:flex;flex-direction:column;gap:10px;overflow-y:auto;
      padding-top:calc(50px + env(safe-area-inset-top,0px))}
    .core{order:1;max-width:230px;margin:0 auto}
    .colR{order:2}.colL{order:3}.dock{order:4}
    .colL,.colR{flex-direction:row;flex-wrap:wrap}
    .colL .panel,.colR .panel{flex:1 1 44%;min-width:0}
    .nn{height:80px}
  }

  /* overlay avvio */
  .activate{position:fixed;inset:0;z-index:60;background:radial-gradient(800px 600px at 50% 45%,#0a1826,#04080f);
    display:grid;place-items:center;text-align:center;padding:24px}
  .activate.hidden{display:none}
  .activate .ring{width:120px;height:120px;border-radius:50%;border:2px solid var(--line);margin:0 auto 20px;
    display:grid;place-items:center;background:radial-gradient(circle,rgba(56,230,255,.25),transparent 60%);
    box-shadow:0 0 40px rgba(56,230,255,.25);animation:breath 2.4s infinite}
  @keyframes breath{50%{box-shadow:0 0 60px rgba(56,230,255,.5)}}
  .activate h1{font-family:var(--disp);letter-spacing:.3em;color:#dff3ff;font-size:1.3rem;margin:0 0 8px;text-shadow:0 0 18px rgba(56,230,255,.6)}
  .activate p{color:var(--muted);font-size:.8rem;margin:0 0 22px;line-height:1.5;max-width:30ch}
  .activate button{font-family:var(--disp);letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;
    border:1px solid var(--cyan);background:rgba(10,24,38,.8);color:var(--cyan);padding:14px 26px;border-radius:12px;cursor:pointer}
  .activate button:active{transform:scale(.97)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bar">
  <a class="back" href="index.html?menu">&#9776; stanze</a>
  <button class="back" id="cfgBtn" style="cursor:pointer;margin-left:8px">&#9881; bot</button>
  <button class="back" id="brainBtn" style="cursor:pointer;margin-left:8px">&#129504;</button>
  <button class="back" id="voiceBtn" style="cursor:pointer;margin-left:8px">&#128483;</button>
  <span class="brandtag">J.A.R.V.I.S</span>
</div>

<div class="grid" id="grid">
  <div class="colL">
    <div class="panel" style="flex:1">
      <h3>Sistema</h3>
      <div class="console" id="console"></div>
    </div>
    <div class="panel">
      <h3>Carico</h3>
      <div class="big" id="load">4.050</div>
      <div class="kv">processi attivi <span id="proc">441</span></div>
      <div class="meter"><i id="loadBar" style="width:62%"></i></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
    <div class="core">
      <canvas id="reactor"></canvas>
      <div class="coretext">
        <div class="t">J.A.R.V.I.S</div>
        <div class="s" id="sub">in attesa</div>
      </div>
    </div>
    <div class="statepill" id="state">standby</div>
  </div>

  <div class="colR">
    <div class="panel">
      <h3>Orario</h3>
      <div class="big" id="clock">--:--:--</div>
      <div class="kv" id="date">—</div>
    </div>
    <div class="panel">
      <h3>Meteo</h3>
      <div class="big" id="temp">--&deg;</div>
      <div class="kv" id="sky">in lettura...</div>
    </div>
    <div class="panel">
      <h3>Rete neurale</h3>
      <canvas class="nn" id="nn"></canvas>
    </div>
  </div>

</div>

<div class="activate" id="activate">
  <div>
    <div class="ring">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#38e6ff" stroke-width="1.4"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
    </div>
    <h1>J.A.R.V.I.S</h1>
    <p>Tocca Attiva per iniziare.</p>
    <button id="go">Attiva</button>
    <button id="voiceTest" style="display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-family:var(--mono);font-size:.72rem;cursor:pointer">&#128266; prova voce</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var APP_VERSION="21";
  (function(){try{fetch(location.pathname+"?cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(t){var m=t.match(/APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION){location.replace(location.pathname+"?v="+Date.now());}}).catch(function(){});}catch(e){}})();
  var speaking=false, listening=false, name="";
  var subEl=document.getElementById("sub"), stateEl=document.getElementById("state");
  var consoleEl=document.getElementById("console");

  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lss(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  // ---------- console ----------
  var BOOT=[
    "avvio nucleo J.A.R.V.I.S v4.050",
    "collegamento rete neurale ... ok",
    "moduli sensoriali ... ok",
    "sintesi vocale ... pronta",
    "protocolli di sicurezza attivi",
    "in ascolto."
  ];
  function cline(t,hot){
    var d=document.createElement("div");d.className="l"+(hot?" hot":"");d.textContent=t;
    consoleEl.appendChild(d);
    while(consoleEl.children.length>14)consoleEl.removeChild(consoleEl.firstChild);
  }

  // ---------- orologio / meteo ----------
  var giorni=["domenica","lunedi","martedi","mercoledi","giovedi","venerdi","sabato"];
  var mesi=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  function p2(n){return(n<10?"0":"")+n;}
  function tick(){var d=new Date();
    document.getElementById("clock").textContent=p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds());
    document.getElementById("date").textContent=giorni[d.getDay()]+" "+d.getDate()+" "+mesi[d.getMonth()];
    document.getElementById("load").textContent=(3.5+Math.random()*1.5).toFixed(3);
    document.getElementById("proc").textContent=430+Math.floor(Math.random()*20);
    document.getElementById("loadBar").style.width=(45+Math.floor(Math.random()*40))+"%";
  }
  setInterval(tick,1000);tick();

  var lastWeather=null;
  function meteoDesc(c){var m={0:"sereno",1:"quasi sereno",2:"poco nuvoloso",3:"nuvoloso",45:"nebbia",48:"nebbia",51:"pioviggine",53:"pioviggine",55:"pioviggine",61:"pioggia",63:"pioggia",65:"pioggia forte",71:"neve",73:"neve",75:"neve",80:"rovesci",81:"rovesci",82:"rovesci",95:"temporale",96:"temporale",99:"temporale"};return m[c]!=null?m[c]:"variabile";}
  function loadWeather(){
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(function(p){
      var u="https://api.open-meteo.com/v1/forecast?latitude="+p.coords.latitude+"&longitude="+p.coords.longitude+"&current=temperature_2m,weather_code";
      fetch(u).then(function(r){return r.json();}).then(function(d){
        var c=d.current||{};lastWeather=c;
        document.getElementById("temp").innerHTML=Math.round(c.temperature_2m)+"&deg;";
        document.getElementById("sky").textContent=meteoDesc(c.weather_code);
      }).catch(function(){document.getElementById("sky").textContent="non disponibile";});
    },function(){document.getElementById("sky").textContent="posizione negata";},{timeout:10000});
  }

  // ---------- globo di particelle ----------
  var cv=document.getElementById("reactor"),ctx=cv.getContext("2d"),t=0;
  var N=150, pts=[];
  (function(){var ga=Math.PI*(3-Math.sqrt(5));for(var i=0;i<N;i++){var y=1-(i/(N-1))*2;var r=Math.sqrt(1-y*y);var th=ga*i;pts.push({x:Math.cos(th)*r,y:y,z:Math.sin(th)*r});}})();
  var pairs=[];
  for(var pi=0;pi<N;pi++){for(var pj=pi+1;pj<N;pj++){var dx=pts[pi].x-pts[pj].x,dy=pts[pi].y-pts[pj].y,dz=pts[pi].z-pts[pj].z;if(dx*dx+dy*dy+dz*dz<0.13)pairs.push([pi,pj]);}}
  function rsize(){var r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;}
  function drawReactor(){
    rsize();var w=cv.width,h=cv.height,cx=w/2,cy=h/2,R=Math.min(w,h)/2-10;
    ctx.clearRect(0,0,w,h);
    var pulse=speaking?(0.85+0.2*Math.abs(Math.sin(t*0.4))):(listening?(0.75+0.1*Math.sin(t*0.12)):(0.65+0.05*Math.sin(t*0.06)));
    var ang=t*0.006, ca=Math.cos(ang), sa=Math.sin(ang);
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,R*1.05);
    g.addColorStop(0,"rgba(255,215,130,"+(0.30*pulse)+")");
    g.addColorStop(0.5,"rgba(255,170,70,"+(0.09*pulse)+")");
    g.addColorStop(1,"rgba(255,160,60,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.05,0,7);ctx.fill();
    var P=[];
    for(var i=0;i<N;i++){var p=pts[i];var X=p.x*ca-p.z*sa;var Z=p.x*sa+p.z*ca;P.push({x:cx+X*R*0.9,y:cy+p.y*R*0.9,z:Z});}
    for(var k=0;k<pairs.length;k++){var a=P[pairs[k][0]],b=P[pairs[k][1]];var al=((a.z+b.z)/2+1)/2;ctx.strokeStyle="rgba(255,190,90,"+(0.06+0.22*al)+")";ctx.lineWidth=0.7+al*0.9;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
    for(var i2=0;i2<N;i2++){var q=P[i2];var al2=(q.z+1)/2;var rad=(1+al2*2.4)*pulse;ctx.fillStyle="rgba(255,"+Math.floor(200+45*al2)+","+Math.floor(110+70*al2)+","+(0.35+0.6*al2)+")";ctx.beginPath();ctx.arc(q.x,q.y,rad,0,7);ctx.fill();}
    t++;requestAnimationFrame(drawReactor);
  }
  drawReactor();

  // ---------- rete neurale ----------
  var nn=document.getElementById("nn"),nx=nn.getContext("2d"),nodes=[];
  function nnSize(){var r=nn.getBoundingClientRect();nn.width=r.width*2;nn.height=r.height*2;
    if(!nodes.length){for(var i=0;i<18;i++)nodes.push({x:0.1+Math.random()*0.8,y:0.1+Math.random()*0.8,p:Math.random()*6,vx:(Math.random()-0.5)*0.0013,vy:(Math.random()-0.5)*0.0013});}}
  function drawNN(){nnSize();var w=nn.width,h=nn.height;nx.clearRect(0,0,w,h);
    for(var m=0;m<nodes.length;m++){var q=nodes[m];q.x+=q.vx;q.y+=q.vy;if(q.x<0.04||q.x>0.96)q.vx*=-1;if(q.y<0.08||q.y>0.92)q.vy*=-1;}
    for(var i=0;i<nodes.length;i++){for(var j=i+1;j<nodes.length;j++){
      var dx=(nodes[i].x-nodes[j].x),dy=(nodes[i].y-nodes[j].y);var d=Math.sqrt(dx*dx+dy*dy);
      if(d<0.33){nx.strokeStyle="rgba(255,190,110,"+(0.22*(1-d/0.33))+")";nx.lineWidth=1;
        nx.beginPath();nx.moveTo(nodes[i].x*w,nodes[i].y*h);nx.lineTo(nodes[j].x*w,nodes[j].y*h);nx.stroke();}}}
    for(var k=0;k<nodes.length;k++){var n=nodes[k];n.p+=0.03;var r=3+2*Math.abs(Math.sin(n.p));
      nx.fillStyle=k%4===0?"rgba(255,150,80,.95)":"rgba(255,205,135,.92)";
      nx.beginPath();nx.arc(n.x*w,n.y*h,r,0,7);nx.fill();}
    requestAnimationFrame(drawNN);
  }
  drawNN();

  // ---------- voce ----------
  function voices(){try{return speechSynthesis.getVoices()||[];}catch(e){return [];}}
  function pickVoice(){
    var v=voices(), pref="";try{pref=localStorage.getItem("qg_voice_name")||"";}catch(e){}
    if(pref){var m=v.filter(function(x){return x.name===pref;})[0];if(m)return m;}
    var it=v.filter(function(x){return /it[-_]IT/i.test(x.lang);});
    if(!it.length)it=v.filter(function(x){return /^it/i.test(x.lang);});
    return it.filter(function(x){return x.localService;})[0]||it[0]||null;
  }
  function pickVoiceMenu(){
    var v=voices().filter(function(x){return /^it/i.test(x.lang)||/it[-_]IT/i.test(x.lang);});
    var lines=["0) Voce AI naturale (serve internet)"].concat(v.map(function(x,i){return (i+1)+") "+x.name;}));
    var sel=prompt("Scegli la voce di Jarvis (scrivi il numero):\n"+lines.join("\n"),"0");
    if(sel===null)return; var n=parseInt(sel,10);
    if(n===0){try{localStorage.setItem("qg_voice_ai","1");}catch(e){} speak("Voce AI attivata."); return;}
    var idx=n-1;
    if(v[idx]){try{localStorage.removeItem("qg_voice_ai");localStorage.setItem("qg_voice_name",v[idx].name);}catch(e){} speak("Voce impostata: "+v[idx].name+".");}
  }
  function aiVoiceOn(){try{return localStorage.getItem("qg_voice_ai")==="1";}catch(e){return false;}}
  function speak(text,then){ if(aiVoiceOn()){speakViaAI(text,then);} else {speakDevice(text,then);} }
  function speakViaAI(text,then){
    subEl.textContent=text;
    var ac=window._jac; if(!ac){speakDevice(text,then);return;}
    var url="https://text.pollinations.ai/"+encodeURIComponent(text)+"?model=openai-audio&voice=nova";
    stateEl.textContent="voce...";
    fetch(url).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
      .then(function(buf){return ac.decodeAudioData(buf);})
      .then(function(ab){
        try{ac.resume();}catch(e){}
        var src=ac.createBufferSource();src.buffer=ab;src.connect(ac.destination);
        speaking=true;stateEl.textContent="risposta";pauseRec();
        src.onended=function(){speaking=false;stateEl.textContent="in ascolto";if(then)then();resumeRec();};
        src.start(0);
      }).catch(function(){ try{localStorage.removeItem("qg_voice_ai");}catch(e){} speakDevice(text,then); });
  }
  function speakDevice(text,then){
    subEl.textContent=text;
    try{
      if(!("speechSynthesis" in window)){if(then)then();return;}
      var u=new SpeechSynthesisUtterance(text);
      u.lang="it-IT";u.rate=0.98;u.pitch=1.02;u.volume=1;
      var vo=pickVoice();if(vo)u.voice=vo;
      var ka=null;
      u.onstart=function(){speaking=true;stateEl.textContent="risposta";pauseRec();
        ka=setInterval(function(){try{speechSynthesis.resume();}catch(e){}},4000);};
      u.onend=function(){if(ka){clearInterval(ka);ka=null;}speaking=false;stateEl.textContent="in ascolto";if(then)then();resumeRec();};
      u.onerror=function(){if(ka){clearInterval(ka);ka=null;}speaking=false;if(then)then();resumeRec();};
      try{speechSynthesis.resume();}catch(_e){}
      speechSynthesis.speak(u);
    }catch(e){if(then)then();}
  }

  // ---------- comandi ----------
  function go(dest,msg){speak(msg,function(){setTimeout(function(){location.href=dest;},300);});}
  function respond(raw){
    var s=(raw||"").toLowerCase().trim();if(!s)return;
    cline("> "+raw,true);
    if(/(ciao|salve|buongiorno|buonasera|ehi|hey)/.test(s)){speak("Salve "+name+". Sono a tua disposizione.");return;}
    if(/^(che ore sono|che ora (è|e)|orario|ora)\s*\??$/.test(s)){var d=new Date();speak("Sono le "+d.getHours()+" e "+d.getMinutes()+".");return;}
    if(/^(che giorno( è| e)?( oggi)?|che giorno siamo|che data|data( di oggi)?|oggi)\s*\??$/.test(s)){var d=new Date();speak("Oggi e "+giorni[d.getDay()]+" "+d.getDate()+" "+mesi[d.getMonth()]+".");return;}
    if(/\bmeteo\b|che tempo|previsioni|quanti gradi|\btemperatura\b/.test(s)){

    var ma;
    if(ma=raw.match(/^(?:aggiungi (?:un |il )?progetto|nuovo progetto)\s+(.+)/i)){agAddProject(ma[1].trim());return;}
    if(ma=raw.match(/^(?:ricordami(?: di| che)?|aggiungi (?:un )?compito|devo|metti tra le cose da fare)\s+(.+)/i)){agAddTask(ma[1].trim());return;}

  function agLoad(){try{var r=localStorage.getItem("qg_agenda_v1");if(r){var o=JSON.parse(r);return{projects:o.projects||[],tasks:o.tasks||[],notes:o.notes||[]};}}catch(e){}return{projects:[],tasks:[],notes:[]};}

  function loadBots(){try{return JSON.parse(localStorage.getItem("qg_bots")||"[]");}catch(e){return [];}}

  function manageBots(){
    var bots=loadBots();
    if(bots.length){
      var lista=bots.map(function(b,i){return (i+1)+") "+b.name;}).join("   ");
      var scelta=prompt("I tuoi bot:  "+lista+"\n\nScrivi:\n- il NUMERO di un bot per rinominarlo\n- 'x' e il numero per toglierlo (es. x2)\n- 'nuovo' per aggiungerne uno","nuovo");
      if(scelta===null)return; scelta=scelta.trim().toLowerCase();
      if(/^x\s*\d+/.test(scelta)){var ri=parseInt(scelta.replace(/[^0-9]/g,""),10)-1;if(bots[ri]){var rn=bots[ri].name;bots.splice(ri,1);saveBots(bots);speak("Bot "+rn+" rimosso.");}return;}
      if(/^\d+$/.test(scelta)){var ei=parseInt(scelta,10)-1;if(bots[ei]){var nn=prompt("Nuovo nome per "+bots[ei].name+":",bots[ei].name);if(nn&&nn.trim()){bots[ei].name=nn.trim();saveBots(bots);speak("Rinominato in "+bots[ei].name+".");}}return;}
      if(scelta!=="nuovo")return;
    }
    var tok=prompt("Incolla il token di un bot Telegram (da BotFather). Vuoto = annulla.","");
    if(tok===null)return; tok=tok.trim(); if(!tok)return;
    var nm=prompt("Nome per questo bot (es. trader, etf):","Bot "+(bots.length+1)); nm=(nm&&nm.trim())?nm.trim():("Bot "+(bots.length+1));
    bots.push({name:nm,token:tok,offset:0}); saveBots(bots);

  function readBots(){
    var bots=loadBots();
    if(!bots.length){speak("Non hai ancora collegato nessun bot, "+name+". Tocca l'ingranaggio in alto e incolla il token del bot Telegram.");return;}
    subEl.textContent="controllo i bot...";stateEl.textContent="bot";cline("controllo i bot Telegram...");
    var summaries=[], pending=bots.length;
    bots.forEach(function(b){
      var u="https://api.telegram.org/bot"+encodeURIComponent(b.token)+"/getUpdates?limit=20&timeout=0"+(b.offset?("&offset="+b.offset):"");
      fetch(u).then(function(r){return r.json();}).then(function(d){
        if(d&&d.ok&&d.result){
          var msgs=d.result.filter(function(x){return x.message&&x.message.text;});
          if(msgs.length){ b.offset=d.result[d.result.length-1].update_id+1;
            var texts=msgs.slice(-5).map(function(x){return x.message.text;});
            summaries.push("Dal bot "+b.name+": "+msgs.length+" messaggi. "+texts.join(". "));
          } else { summaries.push("Dal bot "+b.name+": nessuna novita."); }
        } else { summaries.push("Il bot "+b.name+" non risponde: controlla il token."); }
      }).catch(function(){ summaries.push("Non riesco a contattare il bot "+b.name+"."); })
        .then(function(){ if(--pending===0){ saveBots(bots); var out=summaries.join(" "); cline(out); speak(out.slice(0,650)); } });
    });
  }

  function askAI(q){
    var ck=ls("qg_claude_key")||"", gk=ls("qg_gemini_key")||"", grq=ls("qg_groq_key")||"", ork=ls("qg_or_key")||"";
    cline("Jarvis sta pensando...");subEl.textContent="sto pensando...";stateEl.textContent="elaboro";
    var done=false, to=setTimeout(function(){if(done)return;done=true;speak("Ci sto mettendo troppo, riprova, "+name+".");},25000);
    function fail(){if(done)return;done=true;clearTimeout(to);speak("Non riesco a collegarmi al cervello, "+name+".");}
    function failBrain(n){if(done)return;done=true;clearTimeout(to);speak("Non riesco a raggiungere "+n+" da questo dispositivo, "+name+".");}
    function failNoKey(){if(done)return;done=true;clearTimeout(to);speak("Su questo dispositivo non c'e una chiave attiva, "+name+". Tocca il cervello e mettine una.");}
    function ok(a){if(done)return;done=true;clearTimeout(to);a=cleanAI(a);if(!a){speak("Non ho trovato una risposta, "+name+".");return;}cline(a);speak(a);}
    var oggi=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    var SYS="Sei Jarvis, assistente personale. Oggi e "+oggi+": usa SEMPRE questa data per calcolare eta, anni e per le domande sul presente. Rispondi SEMPRE in italiano corretto e naturale, in modo chiaro, preciso e utile. Dai la risposta giusta e completa ma concisa, adatta a essere letta ad alta voce. Niente elenchi puntati o simboli: solo frasi.";
    if(ck){
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":ck,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-3-5-haiku-latest",max_tokens:500,system:SYS,messages:[{role:"user",content:q}]})})
        .then(function(r){return r.json();}).then(function(d){
          var a="";try{a=(d&&d.content&&d.content[0]&&d.content[0].text)||"";}catch(e){}
          if(!a&&d&&d.error){speak("La chiave Claude non va: "+((d.error&&d.error.message)||"errore")+".");done=true;clearTimeout(to);return;}
          ok(a);
        }).catch(function(){failBrain("Claude");});
    } else if(gk){
      fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(gk),{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({system_instruction:{parts:[{text:SYS}]},contents:[{role:"user",parts:[{text:q}]}]})})
        .then(function(r){return r.json();}).then(function(d){
          var a="";try{a=(d&&d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text)||"";}catch(e){}
          if(!a&&d&&d.error){speak("La chiave Gemini non va: "+((d.error&&d.error.message)||"errore")+".");done=true;clearTimeout(to);return;}
          ok(a);
        }).catch(function(){failBrain("Gemini");});
    } else if(grq){
      var gmodels=["llama-3.1-8b-instant","llama3-8b-8192","gemma2-9b-it","llama-3.3-70b-versatile"];
      (function tryG(i){
        if(done)return;
        if(i>=gmodels.length){fail();return;}
        fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+grq},
          body:JSON.stringify({model:gmodels[i],messages:[{role:"system",content:SYS},{role:"user",content:q}]})})
          .then(function(r){return r.json();}).then(function(d){
            var a="";try{a=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";}catch(e){}
            if(a&&a.trim()){ok(a);return;}
            if(d&&d.error){ var msg=(d.error.message||"")+""; if(/model|does not exist|access|decommission/i.test(msg)){ tryG(i+1); return; } speak("La chiave Groq non va: "+msg+".");done=true;clearTimeout(to);return; }
            tryG(i+1);
          }).catch(function(){failBrain("Groq");});
      })(0);
    } else if(ork){
      var lastErr="";
      function orCall(models){
        (function tryO(i){
          if(done)return;
          if(i>=models.length){done=true;clearTimeout(to);var m=lastErr||"nessun modello gratuito disponibile";cline("OpenRouter: "+m);speak("OpenRouter non risponde: "+m);return;}
          fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+ork},
            body:JSON.stringify({model:models[i],messages:[{role:"system",content:SYS},{role:"user",content:q}]})})
            .then(function(r){return r.json();}).then(function(d){
              var a="";try{a=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";}catch(e){}
              if(a&&a.trim()){ok(a);return;}
              if(d&&d.error){lastErr=(d.error.message||JSON.stringify(d.error))+"";}
              tryO(i+1);
            }).catch(function(e){lastErr=(e&&e.message)||"collegamento bloccato";tryO(i+1);});
        })(0);
      }
      fetch("https://openrouter.ai/api/v1/models").then(function(r){return r.json();}).then(function(md){
        var free=[];
        try{(md.data||[]).forEach(function(m){var p=m.pricing||{};if((p.prompt==="0"||p.prompt===0)&&(p.completion==="0"||p.completion===0))free.push(m.id);});}catch(e){}
        if(!free.length){done=true;clearTimeout(to);speak("OpenRouter non ha modelli gratuiti disponibili adesso, "+name+".");return;}
        free.sort(function(a,b){function sc(x){x=(x||"").toLowerCase();var v=0;if(x.indexOf("llama")>=0)v+=3;if(x.indexOf("70b")>=0||x.indexOf("72b")>=0)v+=3;if(x.indexOf("deepseek")>=0)v+=2;if(x.indexOf("instruct")>=0||x.indexOf("chat")>=0)v+=1;return -v;}return sc(a)-sc(b);});
        orCall(free.slice(0,8));

    } else {
      var sysEnc=encodeURIComponent(SYS), qEnc=encodeURIComponent(q);

        if(at.get){ p=fetch("https://text.pollinations.ai/"+qEnc+"?model="+at.model+"&system="+sysEnc+"&referrer=jarvis").then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){return (t||"").trim();}); }
        else { p=fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:at.model,messages:[{role:"system",content:SYS},{role:"user",content:q}]})}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){var a="";try{a=(d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";}catch(e){}return (a||"").trim();}); }
        p.then(function(a){ if(a && a.charAt(0)!=="<" && a.length>1){ok(a);} else {tryA(i+1);} }).catch(function(){tryA(i+1);});
      })(0);
    }
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null, recActive=false, wantListen=false;
  function pauseRec(){ if(rec&&recActive){try{rec.stop();}catch(e){}} }
  function resumeRec(){ if(rec&&wantListen&&!recActive&&!speaking){try{rec.start();}catch(e){}} }
  function setupVoice(){
    if(!SR){ noVoiceFallback(); return; }
    rec=new SR();rec.lang="it-IT";rec.interimResults=false;rec.continuous=true;rec.maxAlternatives=3;
    rec.onstart=function(){recActive=true;listening=true;if(!speaking)stateEl.textContent="in ascolto";};
    rec.onend=function(){recActive=false;listening=false; if(wantListen&&!speaking){setTimeout(function(){try{rec.start();}catch(e){}},350);} };
    rec.onerror=function(ev){recActive=false;listening=false; if(ev&&ev.error==="not-allowed"){wantListen=false;stateEl.textContent="microfono negato";} };
    rec.onresult=function(ev){var r=ev.results[ev.results.length-1]; if(!r||!r.isFinal)return; var txt=r[0].transcript; if(txt&&txt.trim())respond(txt);};
  }
  function noVoiceFallback(){

  function doActivate(){

    try{var AC=window.AudioContext||window.webkitAudioContext;if(AC){window._jac=window._jac||new AC();if(window._jac.state==="suspended")window._jac.resume();var o=window._jac.createOscillator(),g=window._jac.createGain();g.gain.value=0;o.connect(g);g.connect(window._jac.destination);o.start(0);o.stop(window._jac.currentTime+0.05);}}catch(e){}
    try{speechSynthesis.getVoices();}catch(e){}

  try{if(speechSynthesis && speechSynthesis.onvoiceschanged===null)speechSynthesis.onvoiceschanged=function(){};}catch(e){}
})();
