<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04080f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Team">
<title>Team</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --bg:#05070c; --panel:rgba(255,255,255,.015); --panel2:rgba(0,0,0,.2); --line:rgba(255,205,135,.16);
    --fg:#e8eef6; --muted:#7e8ca0; --gold:#ffcf8a; --gold2:#ffe6bf; --goldline:rgba(255,200,120,.3);
    --live:#ff6a7d; --ok:#5fd6a6;
    --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"Inter",system-ui,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:var(--sans);color:var(--fg);min-height:100dvh;
    background:radial-gradient(1100px 620px at 50% -12%,rgba(255,190,100,.06),transparent 60%),var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:700px;margin:0 auto;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
    padding-block:calc(18px + env(safe-area-inset-top,0px)) 48px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .back{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);color:var(--gold);text-decoration:none;padding:9px 13px;border-radius:10px;background:transparent}
  .back:hover{border-color:var(--goldline)}
  h1{font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;font-size:.9rem;margin:0;color:var(--gold2)}
  .setup{position:relative;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:18px;margin-bottom:18px}
  .setup::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--goldline),transparent)}
  label{display:block;font-size:.62rem;color:var(--gold);margin:0 0 6px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase}
  select,input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--fg);font-family:var(--sans);font-size:.95rem;padding:11px 12px;border-radius:4px;margin-bottom:13px}
  select:focus,input:focus{outline:none;border-color:var(--goldline)}
  input::placeholder{color:var(--muted)}
  .run{width:100%;border:1px solid var(--goldline);background:rgba(255,205,135,.05);color:var(--gold2);font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;padding:14px;border-radius:4px;cursor:pointer}
  .run:hover{background:rgba(255,205,135,.1)}
  .run:disabled{opacity:.45}
  .chat{display:flex;flex-direction:column;gap:12px}
  .mapwrap{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:4px;padding:8px}
  .mapwrap .mapsvg{display:block;width:100%;height:auto}
  .mapbtn{width:100%;margin-top:10px;border:1px solid var(--goldline);background:rgba(255,205,135,.05);color:var(--gold2);font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:12px;border-radius:4px;cursor:pointer}
  .mapbtn:hover{background:rgba(255,205,135,.1)}
  .mapfull{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
    background:radial-gradient(1100px 700px at 50% 0%,rgba(255,190,100,.06),transparent 60%),#05070c;
    padding-top:env(safe-area-inset-top,0px)}
  .mapbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  .mapbar span{font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .mapclose{border:1px solid var(--goldline);background:transparent;color:var(--gold2);font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:8px;cursor:pointer}
  .mapfit{flex:1;min-height:0;display:flex;padding:10px}
  .mapfull .mapsvg{width:100%;height:100%;display:block}
  .msg{display:flex;gap:12px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:14px}
  .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.15rem;background:rgba(255,205,135,.05);border:1px solid var(--line)}
  .msg .b{min-width:0}
  .msg .nm{font-family:var(--mono);font-size:.62rem;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
  .msg .tx{font-size:.9rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .msg.pm{border-color:var(--goldline)}
  .msg.pm .nm{color:var(--gold2)}
  .plan{position:relative;border:1px solid var(--goldline);background:rgba(255,205,135,.04);border-radius:4px;padding:16px;margin-top:16px}
  .plan h3{margin:0 0 10px;font-family:var(--mono);font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .plan .tx{font-size:.9rem;line-height:1.7;white-space:pre-wrap;color:var(--gold2)}
  .exec{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:14px;margin-top:10px}
  .exec .st{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:7px;display:flex;align-items:center;gap:7px}
  .exec .st .n{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .exec .out{font-size:.88rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .note{font-family:var(--mono);font-size:.72rem;color:var(--ok);margin-top:12px;letter-spacing:.04em}
  .status{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--muted);margin:16px 0;min-height:18px}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warn{color:var(--live);font-size:.84rem;line-height:1.6}
  a.lnk{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="index.html?menu">&lsaquo; QG</a><h1>Team del progetto</h1></div>

  <div class="setup">
    <label>Progetto</label>
    <select id="proj"></select>
    <label>Oppure scrivi l'obiettivo</label>
    <input id="goal" placeholder="es. lanciare il mio canale TikTok" maxlength="140">
    <button class="run" id="run">Riunisci il team</button>
  </div>

  <div class="status" id="status"></div>
  <div class="chat" id="chat"></div>
  <div id="planBox"></div>
</div>

<script>
(function(){
  "use strict";
  function ls(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

  // ---- team ----
  var TEAM=[
    {name:"Project Manager",emoji:"🧭",pm:true,role:"Sei il Project Manager del team. Coordini, tieni il focus sull'obiettivo e fai partire il lavoro con una frase."},
    {name:"Stratega",emoji:"♟️",role:"Sei lo Stratega. Definisci l'obiettivo chiave, il pubblico e la direzione in modo concreto."},
    {name:"Sviluppatore",emoji:"🛠️",role:"Sei lo Sviluppatore tecnico. Spieghi COME realizzarlo concretamente, con strumenti semplici e passi fattibili."},
    {name:"Creativo",emoji:"🎨",role:"Sei il Creativo e Designer. Proponi l'aspetto, un nome, lo stile e la comunicazione."},
    {name:"Marketing",emoji:"📣",role:"Sei il responsabile Marketing. Dici come farlo conoscere e crescere, con idee pratiche."}
  ];
  var BASE="Rispondi in italiano, massimo 2-3 frasi, in modo concreto. Parli come in una riunione di team: ti rivolgi ai colleghi e ti basi su quello che hanno gia detto. Niente elenchi puntati, solo frasi.";

  // ---- chiamata AI (usa le chiavi gia impostate in J.A.R.V.I.S) ----
  var _orModel=null;
  function callAI(system,user,done){
    var groq=ls("qg_groq_key"),or=ls("qg_or_key"),gem=ls("qg_gemini_key"),cla=ls("qg_claude_key");
    function fail(m){done(null,m||"cervello non collegato");}
    if(groq){
      var gm=["llama-3.1-8b-instant","llama3-8b-8192","gemma2-9b-it"];
      (function tg(i){if(i>=gm.length){fail("Groq non risponde");return;}
        fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+groq},body:JSON.stringify({model:gm[i],messages:[{role:"system",content:system},{role:"user",content:user}]})}).then(function(r){return r.json();}).then(function(d){var a=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;if(a&&a.trim()){done(a.trim());return;}if(d&&d.error&&/model|decommission|does not exist|access/i.test(d.error.message||"")){tg(i+1);return;}fail((d.error&&d.error.message)||"Groq");}).catch(function(){fail("Groq irraggiungibile");});
      })(0);
    } else if(or){
      function orGo(models){(function to(i){if(i>=models.length){fail("OpenRouter non risponde");return;}fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+or},body:JSON.stringify({model:models[i],messages:[{role:"system",content:system},{role:"user",content:user}]})}).then(function(r){return r.json();}).then(function(d){var a=d&&d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;if(a&&a.trim()){done(a.trim());return;}to(i+1);}).catch(function(){to(i+1);});})(0);}
      if(_orModel){orGo([_orModel]);}
      else{fetch("https://openrouter.ai/api/v1/models").then(function(r){return r.json();}).then(function(md){var free=[];(md.data||[]).forEach(function(m){var p=m.pricing||{};if((p.prompt==="0"||p.prompt===0)&&(p.completion==="0"||p.completion===0))free.push(m.id);});free.sort(function(a,b){function sc(x){x=(x||"").toLowerCase();var v=0;if(x.indexOf("llama")>=0)v+=3;if(x.indexOf("70b")>=0||x.indexOf("72b")>=0)v+=3;if(x.indexOf("deepseek")>=0)v+=2;return -v;}return sc(a)-sc(b);});if(!free.length){fail("nessun modello gratis su OpenRouter");return;}_orModel=free[0];orGo(free.slice(0,4));}).catch(function(){fail("OpenRouter irraggiungibile");});}
    } else if(gem){
      fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(gem),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}]})}).then(function(r){return r.json();}).then(function(d){var a="";try{a=d.candidates[0].content.parts[0].text;}catch(e){}if(a&&a.trim())done(a.trim());else fail("Gemini");}).catch(function(){fail("Gemini irraggiungibile");});
    } else if(cla){
      fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cla,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-3-5-haiku-latest",max_tokens:350,system:system,messages:[{role:"user",content:user}]})}).then(function(r){return r.json();}).then(function(d){var a="";try{a=d.content[0].text;}catch(e){}if(a&&a.trim())done(a.trim());else fail("Claude");}).catch(function(){fail("Claude irraggiungibile");});
    } else {
      fetch("https://text.pollinations.ai/"+encodeURIComponent(user)+"?model=openai&system="+encodeURIComponent(system)+"&referrer=jarvis").then(function(r){return r.text();}).then(function(t){t=(t||"").trim();if(t&&t.charAt(0)!=="<")done(t);else fail("cervello gratuito occupato");}).catch(function(){fail("nessun cervello collegato");});
    }
  }

  // ---- UI ----
  var chat=document.getElementById("chat"), statusEl=document.getElementById("status");
  function addMsg(m,text){
    var el=document.createElement("div");el.className="msg"+(m.pm?" pm":"");
    el.innerHTML='<div class="av">'+m.emoji+'</div><div class="b"><div class="nm">'+esc(m.name)+'</div><div class="tx">'+esc(text)+'</div></div>';
    chat.appendChild(el);el.scrollIntoView({block:"nearest"});
  }
  function setStatus(t,busy){statusEl.innerHTML=(busy?'<span class="spin"></span>':'')+esc(t);}

  // progetti dal registro agenda
  (function(){
    var sel=document.getElementById("proj");
    sel.innerHTML='<option value="">— scegli un progetto —</option>';
    try{var a=JSON.parse(localStorage.getItem("qg_agenda_v1")||"{}");(a.projects||[]).forEach(function(p){var o=document.createElement("option");o.value=p.name;o.textContent=p.name;sel.appendChild(o);});}catch(e){}
  })();

  // chiamata con un paio di tentativi (per i limiti del piano gratuito)
  function callAIretry(system,user,done){
    var tries=0;
    (function go(){
      tries++;
      callAI(system,user,function(ans,err){
        if(ans){done(ans);return;}
        if(tries<3){setStatus("Riprovo tra un istante...",true);setTimeout(go,1600*tries);return;}
        done(null,err||"errore");
      });
    })();
  }
  function keyOf(label){return label.toLowerCase().replace("project manager","pm").replace(/[^a-z]/g,"");}
  function extractJSON(t){
    if(!t)return null;
    var a=t.indexOf("{"), b=t.lastIndexOf("}");
    if(a<0||b<=a)return null;
    try{return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
  }

  var running=false;
  document.getElementById("run").onclick=function(){
    if(running)return;
    var goal=document.getElementById("goal").value.trim()||document.getElementById("proj").value.trim();
    if(!goal){setStatus("Scegli un progetto o scrivi un obiettivo.");return;}
    // controllo cervello
    if(!(ls("qg_groq_key")||ls("qg_or_key")||ls("qg_gemini_key")||ls("qg_claude_key"))){
      setStatus("");
      document.getElementById("planBox").innerHTML='<p class="warn">Per far lavorare il team serve un cervello AI collegato. Apri J.A.R.V.I.S, tocca il cervello e metti una chiave (Groq o OpenRouter). Poi torna qui.</p>';
      return;
    }
    chat.innerHTML="";document.getElementById("planBox").innerHTML="";running=true;document.getElementById("run").disabled=true;
    setStatus("Il team sta discutendo...",true);

    var SYS="Sei un intero team di 5 colleghi che fa una breve riunione operativa in italiano su un progetto. "+
      "I ruoli: Stratega (obiettivo, pubblico, direzione), Sviluppatore (come realizzarlo in pratica, strumenti semplici), "+
      "Creativo (nome, stile, comunicazione), Marketing (come farlo conoscere e crescere), Project Manager (coordina, priorita e tempi). "+
      "Ogni collega scrive il suo contributo in 2-3 frasi concrete, rivolgendosi agli altri e basandosi su cosa hanno detto. Niente elenchi puntati dentro gli interventi. "+
      "Poi il team ESEGUE: per ogni passo del piano (3-4 passi) non si limita a dire cosa fare, ma produce GIA il materiale concreto, pronto da usare. "+
      "Nel campo 'fatto' scrivi il contenuto vero e completo: il testo del listino con i prezzi, il post gia scritto, la mail gia pronta, la bozza, i nomi proposti, ecc. "+
      "Se un passo richiede un'azione nel mondo reale che un assistente non puo compiere (pubblicare online, telefonare, pagare), scrivi lo stesso tutto il materiale pronto e in fondo una riga 'Da fare tu: ...'. "+
      "Rispondi SOLO con un oggetto JSON valido, senza testo prima o dopo, in questa forma esatta: "+
      '{"obiettivo":"riformulazione breve dell obiettivo, max 8 parole","rami":[{"ruolo":"Stratega","testo":"il contributo completo in 2-3 frasi"},{"ruolo":"Sviluppatore","testo":"..."},{"ruolo":"Creativo","testo":"..."},{"ruolo":"Marketing","testo":"..."},{"ruolo":"Project Manager","testo":"..."}],"piano":[{"passo":"titolo breve","fatto":"il materiale concreto gia pronto, anche lungo"}]}';

    callAIretry(SYS, "Progetto o obiettivo: "+goal, function(ans,err){
      running=false;document.getElementById("run").disabled=false;
      if(!ans){setStatus("");document.getElementById("planBox").innerHTML='<div class="plan"><div class="tx">Il team non e riuscito a collegarsi: '+esc(err||"")+'. Riprova tra un minuto, oppure cambia cervello in J.A.R.V.I.S (tasto cervello).</div></div>';return;}
      var data=extractJSON(ans);
      if(!data){ // mostra comunque il testo grezzo
        setStatus("Riunione conclusa.");
        addMsg(TEAM[0],ans);
        return;
      }
      var rami=normRami(data);
      var obiettivo=String(data.obiettivo||goal).trim();
      var svg=buildMap(obiettivo,rami);
      chat.innerHTML='<div class="mapwrap">'+svg+'</div><button class="mapbtn" id="mapFs">Apri la mappa a schermo intero</button>';
      document.getElementById("mapFs").onclick=function(){openFull(svg);};
      openFull(svg);
      setStatus("Mappa pronta. Il team ha eseguito.");
      var piano=normPiano(data.piano);
      if(piano.length){
        var pb=document.getElementById("planBox");
        var html='<div class="plan"><h3>Il team ha fatto questo</h3>';
        piano.forEach(function(p){
          html+='<div class="exec"><div class="st"><span class="n"></span>'+esc(p.passo)+'</div><div class="out">'+esc(p.fatto)+'</div></div>';
        });
        html+='<div class="note" id="saveNote"></div></div>';
        pb.innerHTML=html;
        // salvataggio automatico in agenda
        var n=autoSave(piano,goal);
        document.getElementById("saveNote").textContent="✓ Salvato in agenda: "+n.tasks+" cose da fare e "+n.notes+" note pronte.";
      }
    });
  };

  // ---- mappa concettuale ----
  function openFull(svg){
    var o=document.createElement("div");o.className="mapfull";
    o.innerHTML='<div class="mapbar"><span>Mappa del team</span><button class="mapclose">chiudi ✕</button></div><div class="mapfit">'+svg+'</div>';
    o.querySelector(".mapclose").onclick=function(){o.remove();};
    document.body.appendChild(o);
  }
  function normRami(data){
    var out=[];
    if(Array.isArray(data.rami)){
      data.rami.forEach(function(r){
        if(!r)return;
        var ruolo=String(r.ruolo||r.nome||r.titolo||"").trim();
        var testo=r.testo||r.contributo||r.contenuto||r.punti;
        if(Array.isArray(testo))testo=testo.join(". ");
        testo=String(testo||"").trim();
        if(ruolo)out.push({ruolo:ruolo,testo:testo});
      });
    }
    if(!out.length){ // fallback dal vecchio formato pm/stratega/...
      [["Stratega","stratega"],["Sviluppatore","sviluppatore"],["Creativo","creativo"],["Marketing","marketing"],["Project Manager","pm"]].forEach(function(p){
        var t=data[p[1]];if(t&&String(t).trim())out.push({ruolo:p[0],testo:String(t).trim()});
      });
    }
    return out;
  }
  function wrapText(t,max,maxlines){
    t=String(t||"").trim();if(!t)return[""];
    var words=t.split(/\s+/),lines=[],cur="";
    for(var i=0;i<words.length;i++){var w=words[i];
      if((cur+" "+w).trim().length>max){if(cur){lines.push(cur);cur=w;}else{lines.push(w.slice(0,max));cur="";}
        if(lines.length>=maxlines){break;}}
      else{cur=(cur+" "+w).trim();}}
    if(cur&&lines.length<maxlines)lines.push(cur);
    lines=lines.slice(0,maxlines);
    if(lines.length===maxlines){var rest=words.join(" ");if(rest.length>lines.join(" ").length){var l=lines[maxlines-1];lines[maxlines-1]=(l.length>max-1?l.slice(0,max-1):l)+"…";}}
    return lines;
  }
  // nodo-scatola con titolo (ruolo) + testo intero, dimensione calcolata
  function roleBox(cx,cy,ruolo,testo){
    var W=340, fsT=14.5, fsB=14, lh=20, pad=16, titleH=22, gap=8;
    var maxc=Math.floor((W-pad*2)/(fsB*0.52));
    var body=wrapText(testo,maxc,12);
    var H=pad*2+titleH+gap+body.length*lh;
    var x=cx-W/2, y=cy-H/2;
    var s='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+W+'" height="'+H.toFixed(1)+'" rx="10" fill="rgba(10,14,22,.9)" stroke="rgba(255,200,120,.4)" stroke-width="1.3"/>';
    s+='<text x="'+cx.toFixed(1)+'" y="'+(y+pad+titleH/2).toFixed(1)+'" fill="#ffcf8a" font-size="'+fsT+'" font-weight="700" letter-spacing="1.5" font-family="Inter,system-ui,sans-serif" text-anchor="middle" dominant-baseline="central">'+esc(ruolo.toUpperCase())+'</text>';
    var by=y+pad+titleH+gap+lh/2;
    body.forEach(function(l,i){s+='<text x="'+cx.toFixed(1)+'" y="'+(by+i*lh).toFixed(1)+'" fill="#dfe8f2" font-size="'+fsB+'" font-family="Inter,system-ui,sans-serif" text-anchor="middle" dominant-baseline="central">'+esc(l)+'</text>';});
    return {svg:s, x:x, y:y, w:W, h:H};
  }
  function centerBox(cx,cy,obiettivo){
    var W=300, fs=20, lh=26, pad=18;
    var maxc=Math.floor((W-pad*2)/(fs*0.54));
    var lines=wrapText(obiettivo,maxc,4);
    var H=pad*2+lines.length*lh;
    var x=cx-W/2,y=cy-H/2;
    var s='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+W+'" height="'+H.toFixed(1)+'" rx="12" fill="rgba(255,205,135,.16)" stroke="rgba(255,205,135,.8)" stroke-width="2"/>';
    var ty=y+pad+lh/2;
    lines.forEach(function(l,i){s+='<text x="'+cx.toFixed(1)+'" y="'+(ty+i*lh).toFixed(1)+'" fill="#ffe6bf" font-size="'+fs+'" font-weight="700" font-family="Inter,system-ui,sans-serif" text-anchor="middle" dominant-baseline="central">'+esc(l)+'</text>';});
    return {svg:s,x:x,y:y,w:W,h:H};
  }
  function buildMap(obiettivo,rami){
    var cx=820,cy=720,R=520,n=rami.length||1;
    var lines="",boxes="";
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    function track(b){minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+b.w);maxY=Math.max(maxY,b.y+b.h);}
    var c=centerBox(cx,cy,obiettivo);track(c);
    rami.forEach(function(r,i){
      var ang=(-90+i*(360/n))*Math.PI/180;
      var bx=cx+R*Math.cos(ang),by=cy+R*Math.sin(ang);
      lines+='<line x1="'+cx+'" y1="'+cy+'" x2="'+bx.toFixed(1)+'" y2="'+by.toFixed(1)+'" stroke="rgba(255,200,120,.45)" stroke-width="1.6"/>';
      var b=roleBox(bx,by,r.ruolo,r.testo);track(b);boxes+=b.svg;
    });
    var pad=40;
    var vbX=minX-pad, vbY=minY-pad, vbW=(maxX-minX)+pad*2, vbH=(maxY-minY)+pad*2;
    return '<svg class="mapsvg" viewBox="'+vbX.toFixed(0)+' '+vbY.toFixed(0)+' '+vbW.toFixed(0)+' '+vbH.toFixed(0)+'" preserveAspectRatio="xMidYMid meet">'+lines+c.svg+boxes+'</svg>';
  }

  function normPiano(piano){
    var out=[];
    if(!Array.isArray(piano))return out;
    piano.forEach(function(p){
      if(p&&typeof p==="object"){out.push({passo:String(p.passo||p.titolo||"Passo").trim(),fatto:String(p.fatto||p.contenuto||p.testo||"").trim()});}
      else if(p){out.push({passo:String(p).trim(),fatto:""});}
    });
    return out;
  }
  function autoSave(piano,goal){
    var tc=0,nc=0;
    try{
      var a=JSON.parse(localStorage.getItem("qg_agenda_v1")||"{}");
      a.projects=a.projects||[];a.tasks=a.tasks||[];a.notes=a.notes||[];
      // assicura il progetto
      if(goal&&!a.projects.some(function(x){return (x.name||"").toLowerCase()===goal.toLowerCase();})){
        a.projects.push({id:"x"+Date.now().toString(36)+Math.floor(Math.random()*1000),name:goal.slice(0,60)});
      }
      piano.forEach(function(p){
        if(p.passo){a.tasks.unshift({id:"x"+Date.now().toString(36)+Math.floor(Math.random()*1000),text:p.passo,done:false,proj:goal.slice(0,30)});tc++;}
        if(p.fatto){a.notes.unshift({id:"x"+Date.now().toString(36)+Math.floor(Math.random()*1000),text:"["+p.passo+"] "+p.fatto,ts:Date.now()});nc++;}
      });
      localStorage.setItem("qg_agenda_v1",JSON.stringify(a));
    }catch(e){}
    return {tasks:tc,notes:nc};
  }
})();
</script>
